<div class="h-screen flex flex-column surface-ground">

  <div class="z-2">
    <app-header (menuToggle)="mobileMenuOpen = true"></app-header>
  </div>

  <div class="flex flex-1 overflow-hidden">

    <aside class="hidden md:flex flex-column w-15rem surface-0 shadow-1 p-3">
      <app-sidebar-nav />
    </aside>

    <p-drawer [(visible)]="mobileMenuOpen" position="left" styleClass="w-18rem">
      <app-sidebar-nav (navigate)="mobileMenuOpen = false" />
    </p-drawer>

    <main class="flex-1 overflow-y-auto overflow-x-hidden flex flex-column">
      <div class="flex-1 p-3 md:p-4">
        <router-outlet />
      </div>
    </main>
  </div>

  <div class="z-2">
    <app-footer></app-footer>
  </div>
</div>

<div class="w-full" style="max-width: 26rem">
  <div class="flex flex-column align-items-center mb-5">
    <img src="logo-logipet.png" alt="LogiPet" class="w-6rem mb-3" />
    <span class="text-2xl font-semibold text-color">Nueva contraseña</span>
  </div>

  <p-card styleClass="shadow-2 border-round-2xl">
    @if (tokenMissing) {
      <p-message severity="error" [closable]="false" styleClass="w-full">
        Este link no es válido. Pedí uno nuevo desde "¿Olvidaste tu contraseña?".
      </p-message>
      <div class="mt-4 text-center">
        <a routerLink="/forgot-password" class="text-primary-600 no-underline">
          Pedir un link nuevo
        </a>
      </div>
    } @else {
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-column gap-4">
        <div class="flex flex-column gap-2">
          <label for="newPassword" class="text-sm font-medium text-color-secondary">
            Nueva contraseña
          </label>
          <p-password
            id="newPassword"
            formControlName="newPassword"
            [toggleMask]="true"
            styleClass="w-full"
            inputStyleClass="w-full"
          />
        </div>

        <div class="flex flex-column gap-2">
          <label for="confirmPassword" class="text-sm font-medium text-color-secondary">
            Repetir contraseña
          </label>
          <p-password
            id="confirmPassword"
            formControlName="confirmPassword"
            [toggleMask]="true"
            [feedback]="false"
            styleClass="w-full"
            inputStyleClass="w-full"
          />
          @if (form.errors?.['mismatch'] && form.get('confirmPassword')?.touched) {
            <small class="text-red-500">Las contraseñas no coinciden.</small>
          }
        </div>

        @if (errorMessage()) {
          <p-message severity="error" [closable]="false" styleClass="w-full">
            {{ errorMessage() }}
          </p-message>
        }

        <p-button
          type="submit"
          label="Guardar nueva contraseña"
          [loading]="loading()"
          [disabled]="form.invalid"
          styleClass="w-full"
        />
      </form>
    }
  </p-card>
</div>

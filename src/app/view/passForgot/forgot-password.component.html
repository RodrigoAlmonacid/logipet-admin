<div class="w-full" style="max-width: 26rem">
  <div class="flex flex-column align-items-center mb-5">
    <img src="logo-logipet.png" alt="LogiPet" class="w-6rem mb-3" />
    <span class="text-2xl font-semibold text-color">Recuperar contraseña</span>
  </div>

  <p-card styleClass="shadow-2 border-round-2xl">
    @if (sent()) {
      <p-message severity="success" [closable]="false" styleClass="w-full">
        Si el email está registrado, te vamos a enviar un correo con instrucciones para
        restablecer tu contraseña.
      </p-message>
      <div class="mt-4 text-center">
        <a routerLink="/login" class="text-primary-600 no-underline">Volver al login</a>
      </div>
    } @else {
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-column gap-4">
        <div class="flex flex-column gap-2">
          <label for="email" class="text-sm font-medium text-color-secondary">
            Correo electrónico
          </label>
          <input pInputText id="email" type="email" formControlName="email" class="w-full" />
        </div>

        <p-button
          type="submit"
          label="Enviar instrucciones"
          [loading]="loading()"
          [disabled]="form.invalid"
          styleClass="w-full"
        />

        <div class="text-center">
          <a routerLink="/login" class="text-sm text-color-secondary no-underline">
            Volver al login
          </a>
        </div>
      </form>
    }
  </p-card>
</div>

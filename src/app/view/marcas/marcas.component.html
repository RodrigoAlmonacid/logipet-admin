<p-toast />
<p-confirmdialog />

<div class="flex align-items-center justify-content-between mb-4">
  <h2 class="m-0">Marcas</h2>
  <p-button label="Nueva marca" icon="pi pi-plus" (onClick)="openCreate()" />
</div>

<p-table [value]="marcas()" [loading]="loading()" [paginator]="true" [rows]="10" [rowHover]="true" dataKey="id">
  <ng-template #header>
    <tr>
      <th>Nombre</th>
      <th class="text-right">Acciones</th>
    </tr>
  </ng-template>

  <ng-template #body let-marca>
    <tr>
      <td>{{ marca.nombre }}</td>
      <td class="text-right">
        <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" (onClick)="openEdit(marca)" />
        <p-button icon="pi pi-trash" severity="danger" [text]="true" [rounded]="true" (onClick)="confirmRemove(marca)" />
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr><td colspan="2" class="text-center p-4">No hay marcas cargadas.</td></tr>
  </ng-template>
</p-table>

<p-dialog
  [header]="editing() ? 'Editar marca' : 'Nueva marca'"
  [(visible)]="dialogVisible"
  [modal]="true"
  [draggable]="false"
  [style]="{ width: '26rem' }"
>
  <form [formGroup]="form" (ngSubmit)="save()" class="flex flex-column gap-3">
    <div class="flex flex-column gap-2">
      <label for="nombre" class="text-sm font-medium">Nombre</label>
      <input pInputText id="nombre" formControlName="nombre" class="w-full" />
      @if (form.controls.nombre.invalid && form.controls.nombre.touched) {
        <small class="text-red-500">El nombre es obligatorio.</small>
      }
    </div>

    <div class="flex justify-content-end gap-2 mt-2">
      <p-button label="Cancelar" severity="secondary" [text]="true" (onClick)="dialogVisible.set(false)" />
      <p-button type="submit" label="Guardar" [loading]="saving()" />
    </div>
  </form>
</p-dialog>

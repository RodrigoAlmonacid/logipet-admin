<p-toast />
<p-confirmdialog />

<div class="flex align-items-center justify-content-between mb-4">
  <h2 class="m-0">Roles</h2>
  <p-button label="Nuevo rol" icon="pi pi-plus" (onClick)="openCreate()" />
</div>

<p-table [value]="roles()" [loading]="loading()" [paginator]="true" [rows]="10" dataKey="id">
  <ng-template #header>
    <tr>
      <th>Nombre</th>
      <th>Descripción</th>
      <th>Permisos</th>
      <th class="text-right">Acciones</th>
    </tr>
  </ng-template>

  <ng-template #body let-rol>
    <tr>
      <td>{{ rol.nombre }}</td>
      <td>{{ rol.descripcion }}</td>
      <td>
        <div class="flex flex-wrap gap-1">
          @for (p of rol.permisos; track p.id) {
            <p-tag [value]="p.codigo" severity="info" />
          } @empty {
            <span class="text-color-secondary text-sm">Sin permisos</span>
          }
        </div>
      </td>
      <td class="text-right">
        <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" (onClick)="openEdit(rol)" />
        <p-button icon="pi pi-trash" severity="danger" [text]="true" [rounded]="true" (onClick)="confirmRemove(rol)" />
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr><td colspan="4" class="text-center p-4">No hay roles cargados.</td></tr>
  </ng-template>
</p-table>

<p-dialog [header]="editing() ? 'Editar rol' : 'Nuevo rol'" [(visible)]="dialogVisible" [modal]="true"
  [draggable]="false" [style]="{ width: '34rem' }">
  <form [formGroup]="form" (ngSubmit)="save()" class="flex flex-column gap-3">
    <div class="flex flex-column gap-2">
      <label for="nombre" class="text-sm font-medium">Nombre</label>
      <input pInputText id="nombre" formControlName="nombre" class="w-full" />
      @if (form.controls.nombre.invalid && form.controls.nombre.touched) {
        <small class="text-red-500">El nombre es obligatorio.</small>
      }
    </div>

    <div class="flex flex-column gap-2">
      <label for="descripcion" class="text-sm font-medium">Descripción</label>
      <input pInputText id="descripcion" formControlName="descripcion" class="w-full" />
    </div>

    <div class="flex flex-column gap-2">
      <label for="permisoIds" class="text-sm font-medium">Permisos</label>
      <p-multiselect
        inputId="permisoIds"
        formControlName="permisoIds"
        [options]="permisosDisponibles()"
        optionLabel="codigo"
        optionValue="id"
        [filter]="true"
        filterBy="codigo"
        placeholder="Sin permisos"
        styleClass="w-full"
        [appendTo]="'body'"
      />
    </div>

    <div class="flex justify-content-end gap-2 mt-2">
      <p-button label="Cancelar" severity="secondary" [text]="true" (onClick)="dialogVisible.set(false)" />
      <p-button type="submit" label="Guardar" [loading]="saving()" />
    </div>
  </form>
</p-dialog>

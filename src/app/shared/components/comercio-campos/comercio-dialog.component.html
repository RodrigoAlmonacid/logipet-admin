<p-dialog [header]="titulo()" [(visible)]="visible" [modal]="true" [draggable]="false"
  [style]="{ width: '34rem', maxWidth: '95vw' }">
  <form [formGroup]="group" (ngSubmit)="guardar()" class="flex flex-column gap-3">
    <app-comercio-campos [group]="group" />
    <div class="flex justify-content-end gap-2 mt-2">
      <p-button label="Cancelar" severity="secondary" [text]="true" (onClick)="visible.set(false)" />
      <p-button type="submit" label="Guardar" [loading]="saving()" />
    </div>
  </form>
</p-dialog>

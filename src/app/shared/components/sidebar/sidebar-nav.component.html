<nav class="flex flex-column gap-1">
  @for (Menu of menuVisible(); track Menu.route) {
    <a
      [routerLink]="Menu.route"
      routerLinkActive="bg-primary-50 text-primary-700 font-semibold"
      class="flex align-items-center gap-2 px-3 py-2 border-round text-color no-underline hover:surface-100"
      (click)="onLinkClick()"
    >
      <i [class]="Menu.icon"></i>
      <span>{{ Menu.label }}</span>
    </a>
  }
</nav>

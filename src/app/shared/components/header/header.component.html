<header
    class="flex align-items-center justify-content-between gap-3 px-3 md:px-4 py-2 surface-0 shadow-1 sticky top-0 z-5">
    <div class="flex align-items-center gap-3">
      <p-button icon="pi pi-bars" [text]="true" [rounded]="true" styleClass="md:hidden" ariaLabel="Abrir menú"
        (onClick)="mobileMenuOpen = true" />
      <img src="favicon.png" alt="LogiPet" class="h-2rem" />
      <span class="font-semibold text-color hidden sm:inline">LogiPet</span>
    </div>

    <div class="flex align-items-center gap-3">
      @if (auth.currentUser(); as user) {
      <span class="text-sm font-medium" [title]="user.email">{{ user.nombre }} {{ user.apellido }}</span>
      }
      <p-button icon="pi pi-sign-out" severity="secondary" [text]="true" (onClick)="auth.logout()" [text]="true"
        [rounded]="true" severity="secondary" ariaLabel="Cerrar sesión" />
    </div>
  </header>
